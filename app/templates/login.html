{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h4 mb-3 text-center">Sign In</h1>
    <form method="post">
      <div class="mb-3"><label class="form-label">Email</label>
        <input name="email" type="email" class="form-control" placeholder="you@example.com" required></div>
      <div class="mb-3"><label class="form-label">Password</label>
        <input name="password" type="password" class="form-control" placeholder="Your password" required></div>
      <button class="btn btn-primary w-100" type="submit">Sign In</button>
    </form>
    <div class="text-center mt-3"><small>New? <a href="{{ url_for('auth.signup') }}">Create an account</a></small></div>
  </div></div>
</div></div>
{% endblock %}
