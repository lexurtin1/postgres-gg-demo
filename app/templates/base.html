<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}App{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
      body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; background: #f6f7fb; color: #111827; }
      .container { max-width: 520px; margin: 6rem auto; background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); }
      h1 { margin: 0 0 1rem; font-size: 1.5rem; }
      .muted { color: #6b7280; margin-bottom: 1.5rem; }
      .row { display: flex; flex-direction: column; gap: 0.75rem; }
      label { font-weight: 600; font-size: 0.95rem; }
      input { width: 100%; padding: 0.7rem 0.85rem; border: 1px solid #e5e7eb; border-radius: 8px; outline: none; font-size: 1rem; }
      input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
      .btn { background: #2563eb; color: white; border: none; padding: 0.75rem 1rem; border-radius: 8px; cursor: pointer; font-weight: 600; }
      .btn:disabled { opacity: 0.6; cursor: not-allowed; }
      .link { color: #2563eb; text-decoration: none; }
      .center { text-align: center; margin-top: 1rem; }
      .flash { background: #fee2e2; color: #991b1b; padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; }
    </style>
  </head>
  <body>
    <main class="container">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="flash">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </body>
  </html>
