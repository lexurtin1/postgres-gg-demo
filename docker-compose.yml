services:
  web:
    build: .
    container_name: gg-web
    ports:
      - "5000:5000"
    # Use local .env for secrets, but override DB to use host's Postgres
    env_file:
      - .env
    environment:
      # Point to your existing Postgres container published on host:5433
      - DATABASE_URL=postgresql+psycopg2://gg_user:secret@host.docker.internal:5433/gg-db-dev
      # Ensure the app binds to all interfaces in the container
      - HOST=0.0.0.0
      - PORT=5000
    volumes:
      - ./:/app
      - ./uploads:/app/uploads
    restart: unless-stopped

